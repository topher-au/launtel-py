[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "launtel"
version = "0.1.0"
description = "HTTP client library for the Launtel residential customer portal (residential.launtel.net.au)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.28", "beautifulsoup4>=4.12", "dataclasses-json>=0.6"]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["launtel*"]
