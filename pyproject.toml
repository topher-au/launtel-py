[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "launtel"
version = "0.1.0"
description = "HTTP client library for the Launtel residential customer portal (residential.launtel.net.au)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Topher Sheridan", email = "topher@topher.au" }]
keywords = ["launtel", "isp", "portal", "nbn", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Typing :: Typed",
]
dependencies = ["requests>=2.28", "beautifulsoup4>=4.12", "dataclasses-json>=0.6"]

[project.urls]
Homepage = "https://github.com/topher-au/launtel-py"
Repository = "https://github.com/topher-au/launtel-py.git"
Issues = "https://github.com/topher-au/launtel-py/issues"

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["launtel*"]
